[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statekv"
version = "0.1.0"
description = "State-conditioned KV-cache selection and refresh research"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.4,<2.7",
  "transformers>=4.46,<4.58",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
cuda = ["transformers>=4.51,<4.58", "accelerate>=1.1", "datasets>=3.1", "rouge==1.0.1", "fuzzywuzzy>=0.18", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["statekv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
pythonpath = [".", "benchmarks/torch", "benchmarks/mlx"]
