experiment_name: temporal_cache_mechanism_targeted

model:
  name: mlx-community/Qwen2.5-1.5B-Instruct-4bit
  dtype: 4bit
  backend: mlx
  quant_bits: 4
  deterministic: true
  temperature: 0.0
  do_sample: false
  revision: null
  trust_remote_code: false
  local_files_only: true
  attn_implementation: eager
  prompt_format: chat_template
  system_prompt: null

tasks:
  ruler_niah:
    num_samples: 5
    context_length: 768
  govreport_or_qmsum:
    num_samples: 5
    preferred: gov_report
    max_words: 700
    sample_strategy: first
    fallback_paragraphs: 24
  gsm8k_or_math_long_generation:
    num_samples: 5
    n_distractors: 32

generation:
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
  stop_on_eos: true

cache:
  total_budget: 256
  sink_size: 4
  recent_size: 32
  selected_core_budget: 220

# Retained for compatibility with the original protocol. The targeted runner
# uses mechanism.base_anchor_steps and does not run the ordinary horizon grid.
anchor_steps: [0, 16, 48]
horizons: [1, 4, 16, 64]
strategies:
  - snapkv
  - v_ridge_leverage
  - attention_weighted_v_ridge_leverage
  - future_attention_oracle
signal_lags: [1, 4, 8, 16, 32, 64]

diagnostics:
  num_layers: 3
  heads_per_layer: 2
  layer_selection: evenly_spaced

metrics:
  logits_top_k: 128
  probability_floor: 1.0e-12
  attention_error_epsilon: 1.0e-8
  large_loss_spike_threshold: 0.25

selectors:
  observation_window: 32
  snapkv_pooling_kernel: 63
  snapkv_pooling: max
  ridge_lambda: 0.001
  ridge_lambda_mode: relative
  attention_weighted_ridge_lambda: 0.001
  attention_weight_epsilon: 0.0001
  shared_token_selection: true

validity_thresholds:
  avg_delta_nll: [0.01, 0.05, 0.1, 0.25]
  max_delta_nll: [0.05, 0.1, 0.25, 0.5]
  avg_approx_kl: [0.001, 0.005, 0.01, 0.05]

mechanism:
  enabled: true
  base_anchor_steps: [0, 16, 48]
  refresh_lags: [1, 8, 16, 24, 32, 40, 48, 64]
  online_leverage_scopes:
    - full_history
    - selector_candidate_history
  recent_exit_enabled: true
  recent_exit_base_anchor: 0
  recent_exit_search_max_offset: 31
  recent_exit_relative_lags: [-1, 0, 1]

runtime:
  device: auto
  seed: 42
  deterministic: true
  prefill_chunk_size: 32
  resume: true
  fail_on_error: true
  max_prompt_tokens: 1536
  output_root: results/temporal_cache_discovery
  run_id: mechanism_targeted_4bit_seed42_v1
  bootstrap_samples: 2000
