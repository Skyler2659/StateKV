experiment_name: functional_staleness_stage1_smoke

model:
  name: mlx-community/Qwen2.5-1.5B-Instruct-4bit
  dtype: 4bit
  backend: mlx
  quant_bits: 4
  deterministic: true
  temperature: 0.0
  do_sample: false
  local_files_only: true
  attn_implementation: eager
  prompt_format: chat_template

tasks:
  ruler_niah:
    num_samples: 1
    context_length: 384

generation:
  max_new_tokens: 16
  temperature: 0.0
  do_sample: false
  stop_on_eos: false

cache:
  total_budget: 128
  sink_size: 4
  recent_size: 32
  selected_core_budget: 92

anchor_steps: [0]
horizons: [1]
strategies:
  - snapkv
  - v_ridge_leverage
  - attention_weighted_v_ridge_leverage
  - future_attention_oracle
signal_lags: [1]

diagnostics:
  num_layers: 3
  heads_per_layer: 2
  layer_selection: evenly_spaced

metrics:
  logits_top_k: 128
  probability_floor: 1.0e-12
  attention_error_epsilon: 1.0e-8
  large_loss_spike_threshold: 0.25

selectors:
  observation_window: 32
  snapkv_pooling_kernel: 63
  snapkv_pooling: max
  ridge_lambda: 0.001
  ridge_lambda_mode: relative
  attention_weighted_ridge_lambda: 0.001
  attention_weight_epsilon: 0.0001
  shared_token_selection: true

validity_thresholds:
  avg_delta_nll: [0.01]
  max_delta_nll: [0.05]
  avg_approx_kl: [0.001]

functional_probe:
  enabled: true
  total_budgets: [128]
  protected_recent_sizes: [0]
  selectors: [v_ridge_leverage]
  base_anchor_steps: [0]
  probe_lags: [1, 8]
  feature_variants: [raw_v, projected_v, aov, aor]
  feature_granularities: [layer, diagnostic_head]
  projection_chunk_size: 128
  identity_epsilon: 1.0e-12
  identity_denominator_floor: 1.0e-6
  save_full_reference_npz: false

runtime:
  device: auto
  seed: 42
  deterministic: true
  prefill_chunk_size: 32
  resume: false
  fail_on_error: true
  max_prompt_tokens: 768
  output_root: results/temporal_cache_discovery
  run_id: functional_probe_smoke_4bit_seed42_v1
  bootstrap_samples: 100
