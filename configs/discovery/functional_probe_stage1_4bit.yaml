experiment_name: functional_staleness_stage1

model:
  name: mlx-community/Qwen2.5-1.5B-Instruct-4bit
  dtype: 4bit
  backend: mlx
  quant_bits: 4
  deterministic: true
  temperature: 0.0
  do_sample: false
  local_files_only: true
  attn_implementation: eager
  prompt_format: chat_template

tasks:
  ruler_niah:
    num_samples: 3
    context_length: 768
  govreport_or_qmsum:
    num_samples: 3
    preferred: gov_report
    max_words: 700
    sample_strategy: first
    fallback_paragraphs: 24

generation:
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
  stop_on_eos: false

cache:
  total_budget: 256
  sink_size: 4
  recent_size: 32
  selected_core_budget: 220

anchor_steps: [0, 16, 48]
horizons: [1, 4, 16, 64]
strategies:
  - snapkv
  - v_ridge_leverage
  - attention_weighted_v_ridge_leverage
  - future_attention_oracle
signal_lags: [1, 4, 8, 16, 32, 64]

diagnostics:
  num_layers: 3
  heads_per_layer: 2
  layer_selection: evenly_spaced

metrics:
  logits_top_k: 128
  probability_floor: 1.0e-12
  attention_error_epsilon: 1.0e-8
  large_loss_spike_threshold: 0.25

selectors:
  observation_window: 32
  snapkv_pooling_kernel: 63
  snapkv_pooling: max
  ridge_lambda: 0.001
  ridge_lambda_mode: relative
  attention_weighted_ridge_lambda: 0.001
  attention_weight_epsilon: 0.0001
  shared_token_selection: true

validity_thresholds:
  avg_delta_nll: [0.01, 0.05, 0.1, 0.25]
  max_delta_nll: [0.05, 0.1, 0.25, 0.5]
  avg_approx_kl: [0.001, 0.005, 0.01, 0.05]

functional_probe:
  enabled: true
  total_budgets: [128, 256]
  protected_recent_sizes: [0, 32]
  selectors: [v_ridge_leverage, snapkv]
  base_anchor_steps: [0, 48]
  probe_lags: [1, 8, 16, 24, 32, 40, 48, 64]
  feature_variants: [raw_v, projected_v, aov, aor]
  feature_granularities: [layer, diagnostic_head]
  projection_chunk_size: 128
  identity_epsilon: 1.0e-12
  identity_denominator_floor: 1.0e-6
  save_full_reference_npz: false

runtime:
  device: auto
  seed: 42
  deterministic: true
  prefill_chunk_size: 128
  resume: true
  fail_on_error: true
  max_prompt_tokens: 1536
  output_root: results/temporal_cache_discovery
  run_id: functional_probe_stage1_4bit_seed42_v1
  bootstrap_samples: 2000
