# Sample-split registry for qwen3_8b StateKV experiments.
#
# Splits are disjoint by construction: gov_report offsets map to
# gov_report:{i} and ruler_niah sample_offset maps to synthetic_niah_{i},
# following configs/stages/statekv_p1_p3_gates_qwen3_8b.yaml.  A split is
# "tainted" once a gate/threshold was fit or selected on it; tainted splits
# must not be reused for later fitting or evaluation.
model: mlx-community/Qwen3-8B-4bit
splits:
  p32_p33_dev:
    offsets: [81, 82, 83, 84, 85]
    sample_ids:
      - gov_report:81
      - gov_report:82
      - gov_report:83
      - gov_report:84
      - gov_report:85
      - synthetic_niah_81
      - synthetic_niah_82
      - synthetic_niah_83
      - synthetic_niah_84
      - synthetic_niah_85
    role: p32/p33 development (budget calibration)
    status: tainted
  p34_p35_validation:
    offsets: [86, 87, 88, 89, 90]
    sample_ids:
      - gov_report:86
      - gov_report:87
      - gov_report:88
      - gov_report:89
      - gov_report:90
      - synthetic_niah_86
      - synthetic_niah_87
      - synthetic_niah_88
      - synthetic_niah_89
      - synthetic_niah_90
    role: p34/p35 validation (mechanism + pure-eviction gates)
    status: tainted
  retired_p36:
    offsets: [91, 92, 93, 94, 95]
    sample_ids:
      - gov_report:91
      - gov_report:92
      - gov_report:93
      - gov_report:94
      - gov_report:95
      - synthetic_niah_91
      - synthetic_niah_92
      - synthetic_niah_93
      - synthetic_niah_94
      - synthetic_niah_95
    role: reserved by retired p36
    status: tainted_do_not_use
  r2_validation:
    offsets: [96, 97, 98, 99, 100]
    sample_ids:
      - gov_report:96
      - gov_report:97
      - gov_report:98
      - gov_report:99
      - gov_report:100
      - synthetic_niah_96
      - synthetic_niah_97
      - synthetic_niah_98
      - synthetic_niah_99
      - synthetic_niah_100
    role: r2 validation (refresh-trigger fitting, r2a label collection)
    status: active
  r2_test:
    offsets: [101, 102, 103, 104, 105]
    sample_ids:
      - gov_report:101
      - gov_report:102
      - gov_report:103
      - gov_report:104
      - gov_report:105
      - synthetic_niah_101
      - synthetic_niah_102
      - synthetic_niah_103
      - synthetic_niah_104
      - synthetic_niah_105
    role: r2 test (4-arm refresh gate)
    status: held_out
