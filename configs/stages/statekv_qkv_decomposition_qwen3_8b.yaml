# QK-V decomposition dataset (discovery protocol Phase 1).
#
# Runs the recoverable qk_pool trajectory on the exact R0 substrate with
# per-cycle QK/V instrumentation (token table T, head subset table H,
# swap-oracle table S).  Semantics identical to R0: shared backing pool,
# budget 256 = sink 4 + recent 32 + core 220, refresh every cycle, greedy,
# same-input exact-KL trajectory.
experiment_name: statekv_qkv_decomposition_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/temporal_cache_discovery/statekv_qkv_decomposition_qwen3_8b_v1
data_seed: 20260808
runtime_run_id: statekv_qkv_decomposition_qwen3_8b_seed20260808_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_overrides:
  ruler_niah:
    num_samples: 5
    context_length: 768
    sample_offset: 86
  govreport_or_qmsum:
    num_samples: 5
    preferred: gov_report
    max_words: 700
    sample_indices: [86, 87, 88, 89, 90]
    sample_strategy: first
    fallback_paragraphs: 24

sample_ids:
  - "gov_report:86"
  - "gov_report:87"
  - "gov_report:88"
  - "gov_report:89"
  - "gov_report:90"
  - synthetic_niah_86
  - synthetic_niah_87
  - synthetic_niah_88
  - synthetic_niah_89
  - synthetic_niah_90
expected_sample_count: 10

control_cycles: 64
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220

decomposition_probe:
  dev_sample_ids:
    - synthetic_niah_86
    - synthetic_niah_87
    - "gov_report:86"
  head_cycle_stride: 4
  swap_cycle_stride: 4
  swap_offsets: [1, 2, 4, 8, 16, 32]
  head_window: 16
  head_top: 8
  head_random: 16
