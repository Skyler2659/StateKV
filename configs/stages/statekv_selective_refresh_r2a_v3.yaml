experiment_name: statekv_selective_refresh_r2a_v3_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
data_seed: 20260809
runtime_run_id: statekv_selective_refresh_r2a_v3_qwen3_8b_seed20260809_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

sink_size: 4
recent_size: 32
snapkv_pooling_kernel: 63
snapkv_pooling: max

# v3: v1 (256/768) and v2 (128/768) both showed near time-invariant rankings —
# stale cores from rankings frozen 4/16/32 steps apart are byte-identical and
# differ from fresh only by the deterministic recent-window slide (2 tokens /
# layer / step). P23b's real staleness signal came from multi-K LongBench
# contexts at 128 budget, so move to 4K contexts at the same 128/92 budget
# (compression ratio ~1/32) where coverage drops and rankings can drift.
r2a_labels:
  output_run: results/temporal_cache_discovery/statekv_selective_refresh_labels_r2a_v3
  policies:
    - attention
    - b2_uniform
  control_cycles: 64
  control_horizon: 1
  core_budget: 92
  maximum_delta: 18
  total_budget: 128
  evaluate_exact_kl: true
  refresh_mode: every
  refresh_k: 4
  label_mode: true
  label_stale_lags: [4, 16, 32]
  task_overrides:
    govreport_or_qmsum:
      num_samples: 5
      preferred: gov_report
      max_words: 2800
      sample_indices: [96, 97, 98, 99, 100]
      sample_strategy: first
      fallback_paragraphs: 24
    ruler_niah:
      num_samples: 5
      context_length: 4096
      sample_offset: 96
  sample_ids:
    - gov_report:96
    - gov_report:97
    - gov_report:98
    - gov_report:99
    - gov_report:100
    - synthetic_niah_96
    - synthetic_niah_97
    - synthetic_niah_98
    - synthetic_niah_99
    - synthetic_niah_100

tail_telemetry:
  probability_labels:
    token_17: ["17", " 17"]
    token_14: ["14", " 14"]
  evidence_phrases:
    - "17 sailors"
    - " 17 sailors"
    - "loss of 17 sailors"
    - "deaths of 17 sailors"
