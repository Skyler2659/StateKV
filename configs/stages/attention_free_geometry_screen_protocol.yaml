experiment_name: statekv_attention_free_geometry_screen_p19
status: preregistered_before_execution
objective: screen_multiple_fundamentally_different_attention_free_signals
fixed_budget:
  total_tokens_per_layer: 128
  generation_tokens: 128
methods:
  - name: sink_recent_random
    role: matched_budget_stochastic_control
    signal: none
  - name: knorm
    role: candidate
    signal: retain_low_key_l2_norm
  - name: keydiff
    role: candidate
    signal: negative_cosine_to_mean_key
    recent_ratio: 0.25
  - name: vnorml2
    role: candidate
    signal: retain_high_value_l2_norm
  - name: full
    role: uncompressed_upper_reference
workloads:
  - config: benchmarks/mlx/configs/experiments/statekv/qwen25_15b_govreport_geometry_screen_p19a.yaml
    run_dir: results/temporal_cache_discovery/mlx_qwen25_15b_inst_4bit/longbench/p19a_v1
    sample_ids: [gov_report:54, gov_report:55]
    scope: 700_word_project_workload_not_full_official_context
  - config: benchmarks/mlx/configs/experiments/statekv/qwen25_15b_ruler_geometry_screen_p19b.yaml
    run_dir: results/temporal_cache_discovery/mlx_qwen25_15b_inst_4bit/ruler/p19b_v1
    sample_ids: [niah_single_1:54, niah_single_1:55]
    scope: official_ruler_16k_samples
screening_rules:
  per_candidate:
    - report_each_task_mean_official_score_delta_vs_random_control
    - report_overall_mean_teacher_forced_nll_delta_vs_random_control
    - require_decode_throughput_at_least_90_percent_of_random_control
    - require_peak_memory_no_more_than_125_percent_of_full_reference
    - require_zero_attention_hook_errors
    - require_cache_budget_respected
  selection:
    - do_not_select_a_candidate_that_is_worse_on_both_task_quality_means
    - rank_remaining_candidates_by_task_wins_then_overall_nll_then_throughput
claims_excluded:
  - confirmatory_superiority
  - full_LongBench_official_result
  - cross_model_generalization
  - production_kernel_parity
