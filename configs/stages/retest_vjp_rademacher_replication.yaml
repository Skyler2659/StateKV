experiment_name: statekv_retest_vjp_rademacher_replication

base_config: configs/stages/retest_vjp_base_config.yaml
source_run: results/temporal_cache_discovery/independent_fisher_4bit_24newseq_seed20260726_v1
output_run: results/temporal_cache_discovery/statekv_retest_vjp_rademacher_replication_v1

sample_ids:
  - "gov_report:14"
  - "gov_report:15"
  - "gov_report:16"
  - "gov_report:17"
  - synthetic_niah_14
  - synthetic_niah_15
  - synthetic_niah_16
  - synthetic_niah_17
anchors: [16]
horizon: 8
minimum_horizon: 2

candidate_sources:
  - attention
  - direct_energy_greedy
  - v_ridge
  - aor
  - preceding_anchor_old_core
  - stratified_random_00
  - stratified_random_01
  - stratified_random_02

widths: [8, 16]
fisher_probe_families: [gaussian, rademacher]
refresh_intervals: [4]
decay: 0.95
random_seed: 202608071
adjoint_fd_radii: [0.0003, 0.001, 0.003]
adjoint_error_tolerance: 0.001

baseline: hidden_l2_action
primary:
  method: fisher_rademacher_vjp_action
  width: 8
  refresh_interval: 4

evidence_status: no_gate_independent_sample_replication
claims_excluded:
  - end-to-end controller quality
  - candidate-generation cost
  - wall-clock speedup
  - full-model multi-boundary pullback

analysis_contract:
  hard_gates: false
  note: >
    The P3 post-hoc Rademacher 8-direction variant (normalized regret
    0.1945 -> 0.0696, pairwise -0.0026) was never independently replicated.
    This run re-tests it on 8 untouched sequences from the same frozen
    source run (P3 used only offsets 12/13).  Continuous reporting only.
