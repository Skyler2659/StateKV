experiment_name: statekv_selective_refresh_r2b_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
data_seed: 20260808
runtime_run_id: statekv_selective_refresh_r2b_qwen3_8b_seed20260808_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

sink_size: 4
recent_size: 32
snapkv_pooling_kernel: 63
snapkv_pooling: max

# R2b 4-arm selective-refresh gate on the held-out r2_test split (offsets
# 101-105 per configs/split_registry.yaml; tainted r2_validation 96-100 was
# used for trigger fitting in R2a and is never evaluated here).
r2b_gate:
  output_run: results/temporal_cache_discovery/statekv_selective_refresh_gate_r2b_v1
  policies:
    - attention
    - b2_uniform
  control_cycles: 64
  control_horizon: 1
  core_budget: 92
  maximum_delta: 18
  total_budget: 128
  evaluate_exact_kl: true
  # Fixed-interval arms bracket the trigger arm in refresh-count space.
  refresh_k: [4, 8, 16]
  # Frozen cheap-feature trigger rule (JSON clause schema; see
  # statekv/refresh_trigger.py).  Written by
  # analysis/tables/fit_refresh_trigger.py only if its freeze gate passes.
  # If this file does not exist, the trigger arm is skipped and the gate
  # falls back to the fixed-interval curve verdict.
  trigger_rule: analysis/tables/refresh_trigger_frozen_rule.json
  task_overrides:
    govreport_or_qmsum:
      num_samples: 5
      preferred: gov_report
      max_words: 2800
      sample_indices: [101, 102, 103, 104, 105]
      sample_strategy: first
      fallback_paragraphs: 24
    ruler_niah:
      num_samples: 5
      context_length: 4096
      sample_offset: 101
  sample_ids:
    - gov_report:101
    - gov_report:102
    - gov_report:103
    - gov_report:104
    - gov_report:105
    - synthetic_niah_101
    - synthetic_niah_102
    - synthetic_niah_103
    - synthetic_niah_104
    - synthetic_niah_105

tail_telemetry:
  probability_labels:
    token_17: ["17", " 17"]
    token_14: ["14", " 14"]
  evidence_phrases:
    - "17 sailors"
    - " 17 sailors"
    - "loss of 17 sailors"
    - "deaths of 17 sailors"
