# External-validity gate S1-mk: multi-fact retrieval at 3072 ctx / budget
# 256.  4 needles at spread depths per sample — tests whether qk_pool holds
# several spatially separated small targets as well as one.  Complements
# single-needle NIAH (routing precision) with multi-target working-set load.
experiment_name: statekv_extval_3072_256_mk
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/temporal_cache_discovery/statekv_extval_3072_256_mk_v1
data_seed: 20260808
runtime_run_id: statekv_extval_3072_256_mk_seed20260808_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

runtime_overrides:
  max_prompt_tokens: 8192

task_overrides:
  ruler_niah_multikey:
    num_samples: 3
    context_length: 3072
    sample_offset: 86
    n_keys: 4

sample_ids:
  - synthetic_niah_multikey_86
  - synthetic_niah_multikey_87
  - synthetic_niah_multikey_88
expected_sample_count: 3

start_anchor: 0
control_cycles: 64
control_horizon: 1
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220

snapkv_observation_window: 32
snapkv_pooling_kernel: 63
snapkv_pooling: max
quest_page_size: 16

policies:
  - qk_pool
  - quest_like
  - uniform

candidate_panel:
  - uniform
  - recency
  - qk_pool
  - quest_like

generation: greedy_policy_conditioned_one_step_receding_horizon
bootstrap_samples: 20000
primary_metrics:
  - policy_conditioned_full_vocabulary_exact_kl
  - paired_sample_win_tie_loss
  - step_kl_p95
  - niah_retrieval_accuracy

evidence_status: external_validity_s1_multikey
claims_excluded:
  - deployment_efficiency
  - cpu_gpu_transfer_latency
