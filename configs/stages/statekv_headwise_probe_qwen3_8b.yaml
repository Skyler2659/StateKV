# Open-search HF4 headwise headroom probe.
#
# Runs the qk_pool trajectory on 3 R0 samples with per-KV-head captured-mass
# instrumentation (headwise_rows.parquet): for every cycle/layer/KV-head,
# attention mass captured by the shared head-mean top-220 core vs the head's
# own top-220 core.  Answers: does per-KV-head selection at identical budget
# capture meaningfully more attention mass than head-mean shared selection?
experiment_name: statekv_headwise_probe_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/temporal_cache_discovery/statekv_headwise_probe_qwen3_8b_v1
data_seed: 20260808
runtime_run_id: statekv_headwise_probe_qwen3_8b_seed20260808_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_overrides:
  ruler_niah:
    num_samples: 5
    context_length: 768
    sample_offset: 86
  govreport_or_qmsum:
    num_samples: 5
    preferred: gov_report
    max_words: 700
    sample_indices: [86, 87, 88, 89, 90]
    sample_strategy: first
    fallback_paragraphs: 24

sample_ids:
  - "gov_report:86"
  - synthetic_niah_86
  - synthetic_niah_88
expected_sample_count: 3

control_cycles: 64
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220

decomposition_probe:
  headwise_probe: true
  dev_sample_ids: []
