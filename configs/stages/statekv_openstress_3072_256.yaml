# Open-search HF1 long-context regime (prepared; run only if tight-budget
# 768-ctx runs saturate).  ~3.2K pool, budget 256 -> coverage ~8%, the same
# coverage corner as 768/64 but at real long context with far more
# distractors.  6 samples (3 NIAH + 3 GovReport) to bound MPS runtime.
#
# SUPERSEDED 2026-08-10 by configs/stages/statekv_extval_3072_256.yaml:
# this file lacks runtime_overrides.max_prompt_tokens (base default 1536
# would silently middle-truncate every prompt).  Do NOT run as-is; the
# freegen runner now hard-fails on truncation anyway.
experiment_name: statekv_openstress_3072_256
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/temporal_cache_discovery/statekv_openstress_3072_256_v1
data_seed: 20260808
runtime_run_id: statekv_openstress_3072_256_seed20260808_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_overrides:
  ruler_niah:
    num_samples: 3
    context_length: 3072
    sample_offset: 86
  govreport_or_qmsum:
    num_samples: 3
    preferred: gov_report
    max_words: 2800
    sample_indices: [86, 87, 88]
    sample_strategy: first
    fallback_paragraphs: 24

sample_ids:
  - "gov_report:86"
  - "gov_report:87"
  - "gov_report:88"
  - synthetic_niah_86
  - synthetic_niah_87
  - synthetic_niah_88
expected_sample_count: 6

start_anchor: 0
control_cycles: 64
control_horizon: 1
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220

quest_page_size: 16

policies:
  - qk_pool
  - quest_like
  - uniform

candidate_panel:
  - uniform
  - recency
  - qk_pool
  - quest_like

generation: greedy_policy_conditioned_one_step_receding_horizon
bootstrap_samples: 20000
primary_metrics:
  - policy_conditioned_full_vocabulary_exact_kl
  - paired_sample_win_tie_loss
  - govreport_rouge_l
  - niah_retrieval_accuracy

evidence_status: open_search_hf1_long_context
claims_excluded:
  - deployment_efficiency
  - cpu_gpu_transfer_latency
