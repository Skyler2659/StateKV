# Cheap-R2 ablation: cycle0-only refresh (refresh_frequency=64 > control_cycles=64,
# so the R2 rollout runs exactly once at cycle 0; cycles 1-63 reuse the frozen
# cycle-0 scores under the standard frozen rules). Tests whether recurrent
# refreshes have functional value. Method otherwise identical to the frozen
# Cheap-R2 (H=32, strict pure eviction, sink=4, recent=32). Same fresh multikey
# samples 280-329 as cheapr2_fresh_multikey_v1; reference arms (f16, QK, SnapKV,
# H2O, Full) come from that run — only the cycle0-only arm is new.
experiment_name: statekv_cheapr2_cycle0_multikey_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/statekv_counterfactual/cheapr2_cycle0_multikey_v1
data_seed: 20260820
runtime_run_id: statekv_cheapr2_cycle0_multikey_qwen3_8b_seed20260820_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_families:
  - ruler_niah_multikey
task_settings:
  ruler_niah_multikey:
    context_length: 768
    n_keys: 4
split_indices:
  train: [280, 281, 282, 283, 284, 285, 286, 287, 288, 289,
          290, 291, 292, 293, 294, 295, 296, 297, 298, 299,
          300, 301, 302, 303, 304, 305, 306, 307, 308, 309,
          310, 311, 312, 313, 314, 315, 316, 317, 318, 319,
          320, 321, 322, 323, 324, 325, 326, 327, 328, 329]

control_cycles: 64
total_budget: 512
sink_size: 4
recent_size: 32
core_budget: 476
diagnostic_layers: [0, 7, 14, 15, 21, 27]

closed_loop:
  budgets: [128, 256, 512]
  rollout_horizon: 32
  refresh_frequency: 64
  validation_refresh_frequencies: [64]
  policies:
    - STRICT_CAUSAL_ROLLOUT_R2
  primary_baseline: STRICT_QK_CURRENT
  snapkv_window: 32
  snapkv_pooling_kernel: 63

# Required by the runner's paired-comparison bootstrap step.
gate_a:
  bootstrap_repetitions: 20000
  random_seed: 20260820
