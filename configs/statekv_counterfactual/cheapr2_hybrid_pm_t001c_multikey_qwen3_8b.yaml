# Hybrid QK-R2 variant pm_t001c (cached-R2 between triggers): trigger=periodic_margin threshold=0.001 base_refresh=16, H=32: selective-trigger R2 on multikey@256.
# Cheap QK scores by default; R2 causal rollout only when the QK eviction
# boundary looks uncertain (hybrid.trigger). rollout_horizon=1 is a placeholder
# until the horizon sweep picks the best H.
# Frozen panel: multikey train 200-209, budget 256, refresh 2 (same as teacher PK).
experiment_name: statekv_cheapr2_hybrid_pm_t001c_multikey_qwen3_8b
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: results/statekv_counterfactual/cheapr2_hybrid_pm_t001c_v1
data_seed: 20260820
runtime_run_id: statekv_cheapr2_hybrid_pm_t001c_multikey_qwen3_8b_seed20260820_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_families:
  - ruler_niah_multikey
task_settings:
  ruler_niah_multikey:
    context_length: 768
    n_keys: 4
split_indices:
  train: [200, 201, 202, 203, 204, 205, 206, 207, 208, 209]

control_cycles: 64
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220
diagnostic_layers: [0, 7, 14, 15, 21, 27]

closed_loop:
  budgets: [256]
  rollout_horizon: 32
  refresh_frequency: 2
  validation_refresh_frequencies: [1, 2, 4, 8, 16]
  policies:
    - STRICT_HYBRID_QK_R2
  primary_baseline: STRICT_QK_CURRENT
  snapkv_window: 32
  snapkv_pooling_kernel: 63
  hybrid:
    trigger: periodic_margin
    margin_threshold: 0.001
    entropy_threshold: 0.95
    base_refresh: 16
