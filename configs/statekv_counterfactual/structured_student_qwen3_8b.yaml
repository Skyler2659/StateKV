# Structured R2 student training (STATEKV_STRUCTURED_STUDENT).
#
# Read-only inputs: the frozen existence run's full-cache artifacts and the
# repackaged per-token R2 teacher scores.  Checkpoints land under
# results/statekv_counterfactual/student_models/.
experiment_name: statekv_structured_student_qwen3_8b
data_seed: 20260820

source_run: results/statekv_existence/causal_existence_qwen3_8b_v1
teacher_scores: results/statekv_counterfactual/teacher_scores
output_models: results/statekv_counterfactual/student_models

task_families:
  - ruler_niah
  - govreport_or_qmsum
  - ruler_niah_multikey

sink_size: 4
recent_size: 32
core_budget: 220
future_utility_horizons: [1]

distillation:
  train_indices: [165, 166, 167, 168, 169, 170, 171, 172, 173, 174]
  expected_train_sequences: 30
  teacher: CAUSAL_EXPENSIVE_ROLLOUT_R2_PREFIX_RECOMPUTE

student:
  epochs: 20
  # MPS works but loses to CPU at this model size (launch overhead dominates).
  device: cpu
  cutoff_budgets: [92, 220]
  soft_weight: 0.1
  perhead_aux_weight: 0.3
