experiment_name: qwen25_7b_ruler16k_niah_window_residual_s5_b512

model:
  name: mlx-community/Qwen2.5-7B-Instruct-4bit
  family: qwen
  backend: mlx
  dtype: auto
  device: mps
  quant_bits: 4
  quant_group_size: 64
  mlx_weight_quantize: false
  prefill_step_size: 32768
  trust_remote_code: false
  local_files_only: false
  prompt_format:
    mode: plain
    system_prompt: null

eviction:
  method: window_residual_v_leverage
  cache_size: 512
  sink_size: 0
  recent_size: 0
  score_source: v
  update_policy: prefill_only
  update_interval: 0
  head_strategy: shared
  observation_window: 64
  window_size: 64
  pooling_kernel: 5
  pooling_method: avgpool
  attention_residual_ridge_lambda: 0.001
  attention_residual_budget_ratio: 0.5
  seed: 42

benchmark:
  name: ruler
  tasks:
    - niah_single_1
  use_official_dataset: true
  require_official_dataset: true
  hf_dataset_name: xAlg-AI/att-hub-ruler-16k
  n_samples_per_task: 5
  num_samples: 5
  official_sample_indices: [0, 1, 2, 3, 4]
  max_steps: 32768
  max_new_tokens: 128
  eval_target_only: true
  evaluation: official

methods:
  - window_residual_v_leverage

cache_budgets:
  - 512

analysis:
  overlap: false
  rank_correlation: false
  evidence_recall: true
  case_study: false
  include_oracle: false

output_dir: results/novel_geometry_7b_window_residual_ruler16k_niah_s5_b512
save_selected_tokens: true
save_scores: false
save_prompt_text: false
progress_every: 1
seed: 42
overwrite: false
