experiment_name: qwen25_7b_geometry_screen_gov_qmsum_s8_b256

model:
  name: mlx-community/Qwen2.5-7B-Instruct-4bit
  family: qwen
  backend: mlx
  dtype: auto
  device: mps
  quant_bits: 4
  quant_group_size: 64
  mlx_weight_quantize: false
  mlx_cache_type: kv
  prefill_step_size: 8192
  trust_remote_code: false
  local_files_only: false
  prompt_format:
    mode: plain
    system_prompt: null

eviction:
  method: snapkv
  cache_size: 256
  sink_size: 0
  recent_size: 0
  score_source: v
  update_policy: prefill_only
  update_interval: 0
  head_strategy: shared
  observation_window: 32
  window_size: 32
  pooling_kernel: 5
  pooling_method: avgpool
  conditional_ridge_lambda: 0.001
  conditional_leverage_lambda: 0.001
  attention_residual_ridge_lambda: 0.001
  attention_residual_budget_ratio: 0.5
  attention_weighted_ridge_lambda: 0.001
  attention_weight_epsilon: 0.0001
  ridge_budget_lambda_floor: 0.0001
  diversity_ridge_lambda: 0.001
  diversity_candidate_multiplier: 4
  seed: 42

benchmark:
  name: longbench
  tasks:
    - gov_report
    - qmsum
  max_words: 2500
  n_samples_per_task: 8
  num_samples: 16
  max_steps: 8192
  max_new_tokens: 256
  eval_target_only: true
  evaluation: official
  use_official_prompt: true
  use_official_dataset: true
  require_official_dataset: true
  longbench_max_length: 8192

methods:
  - snapkv
  - ridge_v_shared
  - conditional_v_leverage
  - conditional_k_leverage
  - window_residual_v_leverage
  - window_weighted_v_leverage
  - ridge_v_fixed
  - ridge_v_allocation
  - diversity_v_leverage

cache_budgets:
  - 256

analysis:
  overlap: false
  rank_correlation: false
  evidence_recall: false
  counterfactual_deletion: false
  restoration: false
  leave_one_out: false
  residual_explanation: false
  case_study: false
  include_oracle: false

output_dir: results/geometry_screen_7b_gov_qmsum_s8_b256
save_selected_tokens: true
save_scores: true
save_prompt_text: true
progress_every: 1
seed: 42
overwrite: false
