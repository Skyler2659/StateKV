include:
  - ../runtime/cuda_3090.yaml
  - ../models/qwen25_7b_instruct.yaml
  - ../benchmarks/longbench.yaml
  - ../protocols/query_visible_prefill.yaml
  - ../methods/residual_v.yaml

budget:
  cache_budget: 256
  sink_size: 4
  recent_size: 64
  protect_current: true
  scope: total_kv
  unit: shared_token_positions

generation:
  max_new_tokens: 512
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  stop_on_eos: true
  compute_teacher_forced_ppl: false

output:
  root: results
  experiment_name: longbench_main
  run_id: null
  overwrite: false

