include:
  - ../../runtime/cpu.yaml
  - ../../models/tiny_gpt2.yaml
  - ../../benchmarks/ruler_smoke.yaml
  - ../../protocols/query_visible_prefill.yaml
  - ../../methods/v_leverage_l2.yaml

budget:
  cache_budget: 32
  sink_size: 2
  recent_size: 4
  protect_current: true
  scope: total_kv
  unit: shared_token_positions

generation:
  max_new_tokens: 4
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  stop_on_eos: true
  compute_teacher_forced_ppl: false

output:
  root: results
  experiment_name: ruler_tiny_cpu_smoke
  run_id: null
  overwrite: false

