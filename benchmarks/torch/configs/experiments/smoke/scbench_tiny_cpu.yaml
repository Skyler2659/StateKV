include:
  - ../../runtime/cpu.yaml
  - ../../models/tiny_gpt2.yaml
  - ../../benchmarks/scbench.yaml
  - ../../protocols/query_agnostic_reuse.yaml
  - ../../methods/v_leverage_l2.yaml

benchmark:
  task: scbench_kv
  context_length: 128
  num_samples: 1
  data_path: tests/fixtures/scbench_tiny.jsonl
  require_official: false
  use_official_prompt: true
  use_official_generation_length: false
  truncation: head_tail

budget:
  cache_budget: 16
  sink_size: 1
  recent_size: 2
  protect_current: true
  scope: total_kv
  unit: shared_token_positions

generation:
  max_new_tokens: 3
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  stop_on_eos: true
  compute_teacher_forced_ppl: false

output:
  root: results
  experiment_name: scbench_tiny_cpu_smoke
  run_id: null
  overwrite: false
