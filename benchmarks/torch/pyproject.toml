[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-kvbench"
version = "0.1.0"
description = "Protocol-aware PyTorch/CUDA KV-cache eviction benchmark"
requires-python = ">=3.9"
dependencies = [
  "torch==2.4.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "datasets>=3.1,<3.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "rouge==1.0.1",
  "evaluate==0.4.3",
  "rouge-score==0.1.2",
  "nltk==3.9.1",
  "fuzzywuzzy==0.18.0",
  "tabulate>=0.9",
  "matplotlib>=3.7",
]

[project.scripts]
kvbench-run = "kvbench.cli.run:main"
kvbench-aggregate = "kvbench.analysis.aggregate:main"
kvbench-validate = "kvbench.analysis.validate:main"
kvbench-plot = "kvbench.analysis.plot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["."]
