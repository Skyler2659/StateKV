# R0 smoke: 2 samples x 8 cycles, mechanics validation only.
experiment_name: statekv_recoverable_r0_smoke
base_config: configs/stages/direct_policy_independent_base.yaml
output_run: tmp/r0_smoke_run
data_seed: 20260808
runtime_run_id: statekv_recoverable_r0_smoke_v1

model_overrides:
  name: mlx-community/Qwen3-8B-4bit
  dtype: 4bit
  quant_bits: 4
  revision: 545dc4251c05440727734bcd94334791f6ab0192
  prompt_format: chat_template
  chat_template_kwargs:
    enable_thinking: false

task_overrides:
  ruler_niah:
    num_samples: 5
    context_length: 768
    sample_offset: 86
  govreport_or_qmsum:
    num_samples: 5
    preferred: gov_report
    max_words: 700
    sample_indices: [86, 87, 88, 89, 90]
    sample_strategy: first
    fallback_paragraphs: 24

sample_ids:
  - "gov_report:86"
  - synthetic_niah_86
expected_sample_count: 2

start_anchor: 0
control_cycles: 8
control_horizon: 1
total_budget: 256
sink_size: 4
recent_size: 32
core_budget: 220

snapkv_observation_window: 32
snapkv_pooling_kernel: 63
snapkv_pooling: max
quest_page_size: 16

policies:
  - statekv_exact_mean
  - uniform
  - recency
  - attention
  - qk_pool
  - quest_like

candidate_panel:
  - stale
  - attention
  - snapkv
  - h2o
  - key_norm
  - value_norm
  - uniform
  - recency
  - qk_pool
  - quest_like

generation: greedy_policy_conditioned_one_step_receding_horizon
bootstrap_samples: 200
